# ats-strike-client — a uv workspace with two members.
#
#   contracts/  the wire format client and server agree on (pydantic only):
#               the ats-strike-contract repository, as a git submodule
#   client/     the CLI, shipped as a single-file executable
#
# The client imports the contracts and nothing of the server; the server is
# github.com/gcontini/ats-strike, and the two only meet over HTTP.
# client/tests/test_architecture.py enforces it.
#
# The package sits in client/ rather than at the root because uv does not nest
# workspaces: ats-integration-tests takes client/ as one of its members.
#
#     uv sync                 install both members into one .venv
#     uv run pytest           run both test suites
#     uv run cv --help        the client

[tool.uv.workspace]
members = ["contracts", "client"]

[tool.uv.sources]
ats-strike-contracts = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17.5",
]

# The code is written at 120 columns. The contracts are a submodule: formatted
# in their own repository.
[tool.ruff]
line-length = 120
extend-exclude = ["contracts", "ats-strike-data", "build"]

[tool.pytest.ini_options]
testpaths = ["contracts/tests", "client/tests"]
cache_dir = "build/.pytest_cache"

# Library code only — no test file ever counts towards its own coverage.
[tool.coverage.run]
source = ["contracts/src", "client/src"]
