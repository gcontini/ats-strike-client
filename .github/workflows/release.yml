name: Release

# The client's own version, independent of the server's. You type it here;
# this writes it into client/pyproject.toml and the lock, tags it, builds both
# binaries from that tag and publishes them as one download. See
# doc/release.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "MAJOR.MINOR.PATCH, no leading v"
        required: true
        type: string

# Pushing the bump commit, the tag, and creating the release. The repository
# default for GITHUB_TOKEN is read-only, so this has to ask.
permissions:
  contents: write

# Two releases must never interleave. No cancel-in-progress: a half-cancelled
# release is the one state worth avoiding.
concurrency: release

jobs:
  # The version becomes a commit and a tag. Everything after this builds from
  # that tag, so a binary cannot claim a version it was not built at.
  tag:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # contracts/ is the ats-strike-contract submodule.
          # The push below is a fast-forward of one commit; a shallow clone is
          # one more thing that can refuse it. This repository is small.
          fetch-depth: 0

      - name: Check the version and the branch
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "version must be MAJOR.MINOR.PATCH, got '$VERSION'"; exit 1; }
          [ "$GITHUB_REF" = refs/heads/main ] \
            || { echo "release from main only, dispatched from $GITHUB_REF"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists"; exit 1
          fi

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Write the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          sed -i "s/^version = \".*\"$/version = \"$VERSION\"/" client/pyproject.toml
          # uv.lock records the member's version too. Leaving it stale would
          # commit a lock that disagrees with the manifest, and `uv lock
          # --check` and `uv sync --locked` both refuse that.
          uv lock
          grep -H '^version = ' client/pyproject.toml

      - name: Commit, tag and push
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/pyproject.toml uv.lock
          git commit -m "release v$VERSION"
          git tag "v$VERSION"
          # --atomic: the branch and the tag land together, or neither does.
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # PyInstaller does not cross-compile: one runner per OS. Both check out the
  # tagged commit by sha — main would give a binary one version behind.
  build:
    needs: tag
    strategy:
      # Unlike CI, a release stops at the first failure: there is nothing to
      # learn from the second binary once the first one is wrong.
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true   # contracts/ is the ats-strike-contract submodule.
          ref: ${{ needs.tag.outputs.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: uv run --with pyinstaller pyinstaller --noconfirm --distpath build/dist --workpath build/pyinstaller_cache client/packaging/cv.spec

      # The one thing this job exists to prove. -F because Windows prints CRLF
      # and because a version string is not a regex.
      - name: Check it reports the version being released
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: ./build/dist/cv version | grep -qF "version $VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: build/dist/cv*
          if-no-files-found: error

  # One archive, both binaries, and a data folder ready to run: cv.toml's
  # [servers.v11] points at the server folder v11/, which holds the fictional
  # candidate, so extract, cd in, and it works.
  package:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: package

      - name: Assemble the download
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eux
          mkdir -p package/v11
          cp client/README.md package/
          cp client/cv.toml.example package/cv.toml
          cp examples/candidate/* package/v11/
          cp examples/posting.txt package/
          # The README is written for the repository. Here the fictional
          # candidate set is already in v11/, posting.txt is beside the binary,
          # and doc/ is on GitHub.
          sed -i 's|(\.\./doc/|(https://github.com/${{ github.repository }}/blob/main/doc/|g' package/README.md
          sed -i 's|Start from the fictional set in \[`examples/candidate/`\](\.\./examples/candidate)|The fictional set is already in `v11/` — edit it in place.|' package/README.md
          sed -i '/^   — copy them into your server folder and edit\.$/d' package/README.md
          sed -i 's|^   cv submit-raw \.\./examples/posting\.txt$|   cv submit-raw posting.txt|' package/README.md
          # The artifact service hands every file back as 644; tar stores the
          # mode it is given and tar xzf restores it.
          chmod +x package/cv
          # An explicit list, so a missing file fails the step instead of
          # silently shipping a smaller archive.
          FILES="cv cv.exe README.md cv.toml posting.txt
                 v11/candidate_profile.json v11/candidate_data.json
                 v11/candidate_preferences.md v11/candidate_signature.png"
          tar -czf "ats-strike-client-$VERSION.tar.gz" -C package $FILES
          tar -tzvf "ats-strike-client-$VERSION.tar.gz"
          # Also create a zip archive for Windows users, with the same paths.
          (cd package && zip -q "../ats-strike-client-$VERSION.zip" $FILES)
          unzip -l "ats-strike-client-$VERSION.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # --verify-tag: without it, gh would happily invent the tag from the
        # default branch tip if the tag job had not made one.
        run: gh release create "v$VERSION" "ats-strike-client-$VERSION.tar.gz" "ats-strike-client-$VERSION.zip"
             --verify-tag --generate-notes
